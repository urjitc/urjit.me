<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#c90b1a" />
    <script>
      // Apply a saved theme before the first paint, as on the homepage (src/features/theme.ts).
      try {
        const theme = localStorage.getItem('theme') ?? (matchMedia('(prefers-contrast: more)').matches ? 'dark' : null)
        if (theme) document.documentElement.dataset.theme = theme
      } catch {}
    </script>
    <meta name="color-scheme" content="light" />
    <title>Not found · Urjit</title>
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/pages/not-found.css" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
  </head>
  <body class="not-found">
    <main>
      <h1 aria-label="404: page not found">
        <span aria-hidden="true">4</span>
        <!-- The 0 is a drum head seen from above, hoop and lugs; tap it to play a kick. -->
        <button type="button" class="zero" id="zero" aria-label="Kick drum">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="16" cy="16" r="11.2" />
            <circle class="head" cx="16" cy="16" r="9.4" />
            <path d="M21.6 6.3l.9-1.56M27.2 16h1.8M21.6 25.7l.9 1.56M10.4 25.7l-.9 1.56M4.8 16H3M10.4 6.3l-.9-1.56" />
          </svg>
        </button>
        <span aria-hidden="true">4</span>
      </h1>
      <p>This page missed the beat.</p>
      <p><a href="/">Back to the kit</a></p>
    </main>
    <script type="module" src="/src/pages/not-found.ts"></script>
  </body>
</html>
